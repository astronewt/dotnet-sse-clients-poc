# SSE PoC — full stack in containers. `docker compose up -d --build` starts everything:
#   server : ASP.NET Core SSE server (cleartext http, behind the edge)      -> http://localhost:5020 (direct API)
#   edge   : nginx (TLS + HTTP/2). Serves ALL THREE web clients on one origin + reverse-proxies SSE:
#              https://localhost:8443/          landing
#              https://localhost:8443/vanilla/  vanilla JS client
#              https://localhost:8443/react/    React client
#              https://localhost:8443/blazor/   Blazor WASM client
# The WPF client is a native Windows desktop app (not a web app) and is not containerized;
# run it with `dotnet run --project clients/wpf`.

services:
  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    expose:
      - "8080"
    ports:
      - "5020:8080"   # direct API / vanilla client over http, for debugging
    environment:
      # Simulate a real network (clients are never on the server box). Tune or remove to taste.
      - Latency__Enabled=true
      - Latency__StreamJitterMaxMs=40
      # Uncomment to also get random signal-loss / downtime:
      # - Chaos__Enabled=true

  edge:
    build:
      context: .
      dockerfile: docker/edge.Dockerfile
    ports:
      - "8443:443"
      - "8081:80"     # http -> redirects to 8443
    depends_on:
      - server
