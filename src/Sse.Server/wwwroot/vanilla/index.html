<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vanilla SSE client — SCRUM-5</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; max-width: 1100px; margin: 1.5rem auto; padding: 0 1rem; color: #0f172a; user-select: none; }
    h1 { font-size: 1.4rem; margin-bottom: .25rem; }
    .bar { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin: 1rem 0; }
    button { font: inherit; padding: .4rem .8rem; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; cursor: pointer; }
    button:hover { background: #f8fafc; }
    button.chaos { border-color: #fca5a5; color: #991b1b; }
    button.chaos:hover { background: #fef2f2; }
    .sep { width: 1px; height: 22px; background: #e2e8f0; margin: 0 .2rem; }
    .pill { padding: .15rem .6rem; border-radius: 999px; font-size: .85rem; font-weight: 600; }
    .ok { background: #dcfce7; color: #166534; }
    .bad { background: #fee2e2; color: #991b1b; }
    .wait { background: #fef9c3; color: #854d0e; }
    .stats { display: flex; gap: 1.2rem; flex-wrap: wrap; margin: .5rem 0 1rem; font-variant-numeric: tabular-nums; }
    .stats b { font-size: 1.3rem; display: block; }
    .stats .l { font-size: .75rem; color: #64748b; text-transform: uppercase; letter-spacing: .03em; }
    .panel { border: 1px solid #cbd5e1; border-radius: 8px; padding: .6rem .8rem; margin: .5rem 0; background: #f8fafc; }
    .panel .muted { color: #64748b; font-size: .85rem; margin-left: .5rem; }
    .panel-actions { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin-top: .5rem; }
    .panel-actions input { font: inherit; padding: .35rem .5rem; border: 1px solid #cbd5e1; border-radius: 6px; user-select: text; }
    .panel-actions button.ghost { color: #64748b; border-color: transparent; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; }
    .tile { border: 1px solid #e2e8f0; border-radius: 8px; padding: .45rem .5rem; position: relative; cursor: pointer; }
    .tile:hover { border-color: #94a3b8; }
    .tile .id { font-size: .68rem; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tile .v { font-size: 1.15rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .tile .dot { position: absolute; top: .5rem; right: .5rem; width: 9px; height: 9px; border-radius: 50%; background: #22c55e; }
    .tile.off { background: #f8fafc; color: #94a3b8; }
    .tile.off .v { color: #94a3b8; }
    .tile.off .dot { background: #ef4444; }
    .tile.disabled { opacity: .55; border-style: dashed; }
    .tile.disabled .dot { background: #94a3b8; }
    .tile.selected { outline: 2px solid #3b82f6; outline-offset: -2px; }
    .tile.ack { outline: 2px solid #f59e0b; outline-offset: -2px; }
    .tile.ack.selected { outline-color: #3b82f6; }
    .tile .ackbadge { display: none; position: absolute; bottom: .35rem; right: .4rem; color: #f59e0b; font-weight: 700; font-size: .8rem; }
    .tile.ack .ackbadge { display: block; }
    .tile.flash { animation: flash .5s ease-out; }
    @keyframes flash { from { box-shadow: 0 0 0 2px #3b82f6 inset; } to { box-shadow: none; } }
    .toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 1000; }
    .toast { background: #7f1d1d; color: #fff; padding: .5rem .8rem; border-radius: 8px; font-size: .9rem; box-shadow: 0 4px 12px rgba(0,0,0,.25); animation: toastin .2s ease-out; }
    @keyframes toastin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <h1>Vanilla JS SSE client</h1>
  <p>Native <code>EventSource</code>. Hundreds of sensors, live online/offline status. Serve over HTTPS to exercise HTTP/2.</p>

  <div class="bar">
    <span>Connection:</span> <span id="state" class="pill wait">connecting…</span>
    <span id="proto" class="pill wait">protocol: ?</span>
    <button id="burst">Burst 1000</button>
    <span class="sep"></span>
    <button class="chaos" id="outage">Simulate outage (10s)</button>
    <button class="chaos" id="drop">Drop connections</button>
  </div>

  <div class="stats">
    <div><b id="s-total">0</b><span class="l">sensors</span></div>
    <div><b id="s-online" style="color:#166534">0</b><span class="l">online</span></div>
    <div><b id="s-offline" style="color:#991b1b">0</b><span class="l">offline</span></div>
    <div><b id="s-events">0</b><span class="l">events</span></div>
    <div><b id="s-lat">–</b><span class="l">latency ms</span></div>
    <div><b id="s-gaps">0</b><span class="l">gaps</span></div>
    <div><b id="s-dupes">0</b><span class="l">dupes</span></div>
    <div><b id="s-ooo">0</b><span class="l">out of order</span></div>
  </div>

  <div id="panel" class="panel" hidden></div>

  <div class="grid" id="grid"></div>

  <div class="toasts" id="toasts"></div>

  <script>
    const $ = id => document.getElementById(id);
    const grid = $('grid'), panel = $('panel');
    const tiles = new Map();   // sensorId -> { el, vEl, idEl, value, online, acknowledged, enabled, name }
    let received = 0, lastSeq = 0, gaps = 0, dupes = 0, ooo = 0, online = 0, selected = null;

    const setPill = (el, text, cls) => { el.textContent = text; el.className = 'pill ' + cls; };
    const post = url => fetch(url, { method: 'POST' });
    const label = t => t.name || t.id;

    function upsertTile(id, d, flash) {
      let t = tiles.get(id);
      if (!t) {
        const el = document.createElement('div');
        el.className = 'tile';
        el.title = 'Click to select';
        el.innerHTML = `<div class="dot"></div><div class="id"></div><div class="v"></div><div class="ackbadge">✓</div>`;
        el.addEventListener('click', () => select(id));
        grid.appendChild(el);
        t = { id, el, vEl: el.querySelector('.v'), idEl: el.querySelector('.id'), online: true };
        tiles.set(id, t);
        online++;
      }
      t.value = d.value; t.acknowledged = d.acknowledged; t.enabled = d.enabled; t.name = d.name;
      t.vEl.textContent = d.value;
      t.idEl.textContent = label(t);
      if (t.online !== d.online) { t.online = d.online; online += d.online ? 1 : -1; }
      t.el.classList.toggle('off', !d.online);
      t.el.classList.toggle('disabled', !d.enabled);
      t.el.classList.toggle('ack', d.acknowledged);
      t.el.classList.toggle('selected', id === selected);
      if (flash) { t.el.classList.remove('flash'); void t.el.offsetWidth; t.el.classList.add('flash'); }
    }

    function select(id) {
      if (selected && tiles.has(selected)) tiles.get(selected).el.classList.remove('selected');
      selected = id;
      if (tiles.has(id)) tiles.get(id).el.classList.add('selected');
      renderPanel();
    }

    function renderPanel() {
      const t = selected && tiles.get(selected);
      if (!t) { panel.hidden = true; return; }
      panel.hidden = false;
      const status = !t.enabled ? 'disabled' : t.online ? 'online' : 'offline';
      panel.innerHTML =
        `<div><strong>${label(t)}</strong><span class="muted">${t.id} · value ${t.value} · ${status}${t.acknowledged ? ' · acknowledged' : ''}</span></div>
         <div class="panel-actions">
           <button data-a="ack">${t.acknowledged ? 'Un-acknowledge' : 'Acknowledge'}</button>
           <button data-a="toggle">${t.enabled ? 'Disable' : 'Enable'}</button>
           <input id="rename" placeholder="new name" value="${(t.name || '').replace(/"/g, '&quot;')}" />
           <button data-a="rename">Rename</button>
           <button class="ghost" data-a="close">Close</button>
         </div>`;
      const id = encodeURIComponent(t.id);
      panel.querySelector('[data-a=ack]').onclick = () => post(`/sensors/${id}/ack`);
      panel.querySelector('[data-a=toggle]').onclick = () => post(`/sensors/${id}/toggle`);
      panel.querySelector('[data-a=rename]').onclick = () => post(`/sensors/${id}/name?name=${encodeURIComponent($('rename').value)}`);
      panel.querySelector('[data-a=close]').onclick = () => select(null);
    }

    function renderStats() {
      $('s-total').textContent = tiles.size;
      $('s-online').textContent = online;
      $('s-offline').textContent = tiles.size - online;
      $('s-events').textContent = received;
      $('s-gaps').textContent = gaps;
      $('s-dupes').textContent = dupes;
      $('s-ooo').textContent = ooo;
    }

    function onSnapshot(e) {
      const d = JSON.parse(e.data);
      lastSeq = d.seq;                          // start integrity tracking from here
      grid.innerHTML = ''; tiles.clear(); online = 0;
      for (const s of d.sensors) upsertTile(s.sensorId, s, false);
      renderStats(); renderPanel();
    }

    function onSensor(e) {
      const d = JSON.parse(e.data);
      if (lastSeq !== 0) {
        if (d.seq === lastSeq) dupes++;
        else if (d.seq < lastSeq) ooo++;
        else if (d.seq > lastSeq + 1) gaps += d.seq - lastSeq - 1;
      }
      lastSeq = Math.max(lastSeq, d.seq);
      received++;
      $('s-lat').textContent = Date.now() - d.ts;
      const prev = tiles.get(d.sensorId);
      // Toast when a sensor drops — unless acknowledged or intentionally disabled.
      if (prev && prev.online && !d.online && !d.acknowledged && d.enabled) showToast(d.sensorId);
      upsertTile(d.sensorId, d, true);
      if (d.sensorId === selected) renderPanel();
      renderStats();
    }

    const toastBox = $('toasts');
    function showToast(sensorId) {
      if (toastBox.childElementCount >= 5) toastBox.firstChild.remove();
      const el = document.createElement('div');
      el.className = 'toast';
      el.innerHTML = `🔴 <strong>${sensorId}</strong> went offline`;
      toastBox.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }

    let es;
    function connect() {
      es = new EventSource('/sse');
      es.addEventListener('open', () => setPill($('state'), 'connected', 'ok'));
      es.addEventListener('error', () => setPill($('state'), 'reconnecting…', 'bad'));
      es.addEventListener('snapshot', onSnapshot);
      es.addEventListener('sensor', onSensor);
    }
    connect();

    setTimeout(() => {
      const r = performance.getEntriesByType('resource').find(e => e.name.includes('/sse'));
      const proto = r?.nextHopProtocol || '(unknown)';
      setPill($('proto'), 'protocol: ' + proto, proto === 'h2' ? 'ok' : 'wait');
    }, 1500);

    $('burst').onclick = () => post('/admin/burst?count=1000');
    $('outage').onclick = () => post('/admin/chaos/outage?seconds=10');
    $('drop').onclick = () => post('/admin/chaos/drop');
  </script>
</body>
</html>
