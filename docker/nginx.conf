# Single edge: terminates TLS, speaks HTTP/2 to the browser, reverse-proxies SSE.
# One origin serves all clients + the stream, so many SSE streams multiplex on one h2 connection.

server {
    listen 80;
    server_name localhost;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/self.crt;
    ssl_certificate_key /etc/nginx/certs/self.key;

    root /usr/share/nginx/html;

    # React SPA (built with a relative base).
    location /react/ {
        try_files $uri $uri/ /react/index.html;
    }

    # Blazor WASM (base href = /blazor/).
    location /blazor/ {
        try_files $uri $uri/ /blazor/index.html;
    }

    # SSE stream: no buffering, keep the connection open.
    location /sse {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Everything else (landing page, /vanilla, /admin) -> server.
    location / {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
    }
}
